[project]
name = "google-a2a-azure-demo"
version = "1.0.0"
description = "Google Agent-to-Agent (A2A) Protocol Demo with Azure OpenAI"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/shyamsridhar123/Google_AzureOpenAI_A2A-Simplified"
Repository = "https://github.com/shyamsridhar123/Google_AzureOpenAI_A2A-Simplified"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
