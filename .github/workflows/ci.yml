name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy

    - name: Run linting with ruff
      run: |
        ruff check .
      continue-on-error: false

    - name: Run type checking with mypy
      run: |
        mypy --ignore-missing-imports .
      continue-on-error: true

    - name: Run import smoke test
      run: |
        python -c "from agents.base_agent import BaseAgent; from schemas.base import Task, TaskState, Message; from utils.conversation import ConversationManager; print('✅ All imports successful')"
